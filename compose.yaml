services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ehud_radar
      POSTGRES_DB: ehud_radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ehud_radar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehud_radar -d ehud_radar"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3002
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://ehud_radar:${POSTGRES_PASSWORD}@postgres:5432/ehud_radar
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the frontend HTTPS origin in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      DEMO_LOGIN_PASSWORD: ${DEMO_LOGIN_PASSWORD:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
    ports:
      - "${API_HOST_PORT:-127.0.0.1:3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - edge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    profiles: ["legacy"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${CADDY_DOMAIN:?Set CADDY_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ehud_radar_postgres:
  caddy_data:
  caddy_config:

networks:
  default:
  edge:
    external: true
    name: edge-proxy_default